<body><main id="bootmsg"><p class="muted">Starting Peak ESG…</p></main></body>

<!-- Boot guard. A classroom must never be shown a blank white page: if the
     module does not start, say why and offer the way out. Classic script on
     purpose — it has to run even when module loading is what failed. -->
<script>
(function () {
  var errs = [];
  function note(m) {
    m = String(m == null ? '' : m);
    if (m && m !== 'undefined' && errs.indexOf(m) < 0) errs.push(m);
  }
  window.addEventListener('error', function (e) {
    // Captured on the way down, so a <script> or <link> that failed to FETCH
    // arrives here too — and a resource error carries no message at all. That
    // was being stringified into a box that said, helpfully, "undefined".
    var el = e.target;
    if (el && el !== window && (el.src || el.href)) {
      note('could not load ' + String(el.src || el.href).split('/').pop().split('?')[0]);
      return;
    }
    note(e.message + (e.filename ? '  (' + e.filename.split('/').pop() +
         (e.lineno ? ':' + e.lineno : '') + ')' : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    note((e.reason && e.reason.message) || e.reason);
  });

  function freshHref() {
    var q = new URLSearchParams(location.search);
    q.set('fresh', '1');
    return location.pathname + '?' + q.toString();
  }
  function fail(title, body) {
    var d = document.getElementById('bootmsg') || document.body;
    d.className = '';
    d.innerHTML = '<div class="bootfail"><h1>' + title + '</h1>' + body +
      (errs.length ? '<pre>' + errs.join('\n').replace(/[<>&]/g, ' ') + '</pre>' : '');
  }

  if (location.protocol === 'file:') {
    fail('Open this through the Peak ESG server',
      '<p>This page was opened straight from the Finder, so the browser refuses to load ' +
      'the game&rsquo;s own files.</p><p>Start <b>Peak ESG.command</b>, then type the address ' +
      'it prints:</p><p><code>http://&lt;the Mac&rsquo;s address&gt;:8750/client/index.html?net=fire</code></p>');
    return;
  }

  var waited = 0;
  var watch = setInterval(function () {
    if (window.__peakBooted) { clearInterval(watch); return; }
    waited += 500;
    if (waited < 12000) return;
    clearInterval(watch);
    fail('Peak ESG did not start',
      '<p>Reload the page. If that does not help, start a clean game &mdash; ' +
      'this forgets anything saved on <i>this</i> device only.</p>' +
      '<p><a class="btn" href="' + freshHref() + '">Start a clean game</a></p>');
  }, 500);
})();
</script>
<script type="module" src="./app.mjs?v=11051038"></script>
</html>
